<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Behind Hind Sight cover</title>
  <desc id="desc">Minimal book cover for Behind Hind Sight by Amanah Saais with a coming soon badge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2eee6"/>
      <stop offset=".54" stop-color="#d8c7ac"/>
      <stop offset="1" stop-color="#141417"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".54">
      <stop offset="0" stop-color="#fff7e6" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#d9aa66" stop-opacity=".38"/>
      <stop offset="1" stop-color="#18181a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <rect width="1200" height="1500" fill="url(#glow)"/>
  <g opacity=".14" fill="none" stroke="#18181a" stroke-width="2">
    <path d="M180 190h840v1120H180z"/>
    <path d="M242 250h716v998H242z"/>
    <path d="M340 750c130-210 382-210 520 0-144 214-389 214-520 0Z"/>
    <circle cx="600" cy="750" r="126"/>
    <circle cx="600" cy="750" r="46" fill="#18181a" opacity=".45"/>
  </g>
  <g filter="url(#softShadow)">
    <rect x="458" y="482" width="284" height="402" rx="142" fill="#18181a" opacity=".88"/>
    <path d="M600 410c103 0 187 84 187 187 0 184-187 360-187 360S413 781 413 597c0-103 84-187 187-187Z" fill="#fff7e6" opacity=".92"/>
    <path d="M600 510c48 0 87 39 87 87 0 86-87 169-87 169s-87-83-87-169c0-48 39-87 87-87Z" fill="#18181a"/>
  </g>
